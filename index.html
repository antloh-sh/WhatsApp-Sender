<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Queue Sender</title>

  <style>
    :root {
      --bg: #f9fafb;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --primary: #10b981;
      --blue: #3b82f6;
      --red: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 16px 24px;
      font-size: 20px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }

    main {
      padding: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .card h2 {
      font-size: 15px;
      margin: 0;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
      margin-top: 8px;
    }

    .example {
      margin-top: 8px;
      background: #f3f4f6;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      white-space: pre;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 14px;
      margin-top: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
    }

    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filters {
      display: flex;
      gap: 12px;
      font-size: 12px;
    }

    .filters label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .count-pill {
      font-weight: 600;
      opacity: 0.7;
    }

    .queue {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .contact {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .contact:last-child { border-bottom: none; }

    .contact.active {
      background: #ecfdf5;
      border-left: 4px solid var(--primary);
    }

    .contact .name { font-weight: 500; }
    .contact .number { font-size: 12px; color: var(--muted); }

    .status { font-size: 10px; font-weight: 700; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .status.pending { color: var(--muted); }
    .status.opened { color: var(--blue); }
    .status.sent { color: var(--primary); }
    .status.invalid { color: var(--red); }

    .preview {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 12px;
      background: #f3f4f6;
      min-height: 80px;
      line-height: 1.4;
    }

    .preview strong { font-weight: 600; }
    .preview em { font-style: italic; }
    .preview del { text-decoration: line-through; }

    .buttons {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 14px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.primary {
      background: var(--primary);
      color: white;
      border: none;
    }

    button.danger {
      color: var(--red);
      border-color: var(--red);
    }

    button.danger:hover {
      background: #fef2f2;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    footer {
      padding: 12px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>
<header>WhatsApp Queue Sender</header>

<main>

  <div class="card">
    <h2>1. Upload CSV</h2>
    <input type="file" id="csvFile" accept=".csv" style="margin-top:8px;" />
    <div id="csvStatus" class="hint">Please upload a file to begin.</div>
  </div>

  <div class="card">
    <h2>2. Message Template</h2>
    <textarea id="template" placeholder="Hi *{{Name}}* 😅"></textarea>
  </div>

  <div class="grid">
    <div class="card">
      <div class="queue-header">
        <h2>3. Contact Queue</h2>
        <div class="filters">
          <label><input type="checkbox" class="filter-chk" value="pending" checked> Pend (<span id="cnt-pending">0</span>)</label>
          <label><input type="checkbox" class="filter-chk" value="opened" checked> Open (<span id="cnt-opened">0</span>)</label>
          <label><input type="checkbox" class="filter-chk" value="sent"> Sent (<span id="cnt-sent">0</span>)</label>
          <label><input type="checkbox" class="filter-chk" value="invalid"> Inv (<span id="cnt-invalid">0</span>)</label>
        </div>
      </div>
      <div id="queue" class="queue"></div>
    </div>

    <div class="card">
      <h2>Message Preview</h2>
      <div id="preview" class="preview" style="margin-top:8px;"></div>

      <div class="buttons">
        <button id="openBtn" class="primary" disabled>Open in WhatsApp</button>
        <button id="sentBtn" disabled>Mark as Sent</button>
        <button id="invalidBtn" class="danger" disabled>Mark Invalid</button>
        <button id="skipBtn" disabled>Skip</button>
      </div>
    </div>
  </div>

</main>

<footer>🔒 No data is stored or uploaded to any server.</footer>

<script>
  const csvFile = document.getElementById('csvFile');
  const queueEl = document.getElementById('queue');
  const previewEl = document.getElementById('preview');
  const openBtn = document.getElementById('openBtn');
  const sentBtn = document.getElementById('sentBtn');
  const invalidBtn = document.getElementById('invalidBtn');
  const skipBtn = document.getElementById('skipBtn');
  const templateEl = document.getElementById('template');
  const csvStatus = document.getElementById('csvStatus');
  const filterChks = document.querySelectorAll('.filter-chk');

  let contacts = [];
  let currentIndex = -1;

  csvFile.addEventListener('change', () => {
    const file = csvFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => parseCSV(e.target.result);
    reader.readAsText(file);
  });

  templateEl.addEventListener('input', renderPreview);
  
  filterChks.forEach(chk => {
    chk.addEventListener('change', renderQueue);
  });

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    const headers = lines.shift().split(',').map(h => h.trim());

    if (!headers.includes('Name') || !headers.includes('ContactNumber')) {
      csvStatus.textContent = '❌ Invalid CSV headers';
      return;
    }

    contacts = lines.map(line => {
      const values = line.split(',');
      const row = {};
      headers.forEach((h, i) => row[h] = values[i]?.trim() || '');
      row._status = 'pending';
      return row;
    });

    csvStatus.textContent = `✅ Loaded ${contacts.length} contacts`;
    selectContact(0);
    renderQueue();
  }

  function updateCounts() {
    const counts = { pending: 0, opened: 0, sent: 0, invalid: 0 };
    contacts.forEach(c => counts[c._status]++);
    for (const key in counts) {
      document.getElementById(`cnt-${key}`).textContent = counts[key];
    }
  }

  function renderQueue() {
    updateCounts();
    queueEl.innerHTML = '';
    const activeFilters = Array.from(filterChks)
                               .filter(chk => chk.checked)
                               .map(chk => chk.value);

    contacts.forEach((c, i) => {
      // Logic: Only show if the status is currently checked in filters
      if (activeFilters.includes(c._status)) {
        const div = document.createElement('div');
        div.className = 'contact' + (i === currentIndex ? ' active' : '');
        div.innerHTML = `
          <div class="name">${c.Name}</div>
          <div class="number">+${c.ContactNumber}</div>
          <div class="status ${c._status}">${c._status}</div>
        `;
        div.onclick = () => selectContact(i);
        queueEl.appendChild(div);
      }
    });

    if (currentIndex >= 0 && !activeFilters.includes(contacts[currentIndex]._status)) {
        previewEl.innerHTML = '<div style="color:var(--muted); font-style:italic; padding:10px; text-align:center;">Selected contact is hidden by filters.</div>';
    } else if (currentIndex >= 0) {
        renderPreview();
    }
  }

  function selectContact(index) {
    currentIndex = index;
    openBtn.disabled = sentBtn.disabled = invalidBtn.disabled = skipBtn.disabled = false;
    renderQueue();
    renderPreview();
  }

  function escapeHTML(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatWhatsApp(text) {
    let safe = escapeHTML(text);
    safe = safe.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
    safe = safe.replace(/_(.*?)_/g, '<em>$1</em>');
    safe = safe.replace(/~(.*?)~/g, '<del>$1</del>');
    return safe.replace(/\n/g, '<br>');
  }

  function renderPreview() {
    if (currentIndex < 0) return;
    const c = contacts[currentIndex];
    const merged = templateEl.value.replace(/{{Name}}/g, c.Name);
    previewEl.innerHTML = formatWhatsApp(merged);
  }

  openBtn.onclick = () => {
    const c = contacts[currentIndex];
    const rawMessage = templateEl.value.replace(/{{Name}}/g, c.Name);
    const encodedMessage = encodeURIComponent(rawMessage);
    const url = `https://api.whatsapp.com/send?phone=${c.ContactNumber}&text=${encodedMessage}&app_absent=0`;
    window.open(url, '_blank');
    c._status = 'opened';
    renderQueue();
  };

  sentBtn.onclick = () => markAndMove('sent');
  invalidBtn.onclick = () => markAndMove('invalid');
  skipBtn.onclick = () => markAndMove('pending');

  function markAndMove(status) {
    contacts[currentIndex]._status = status;
    const activeFilters = Array.from(filterChks).filter(chk => chk.checked).map(chk => chk.value);
    
    let nextIdx = currentIndex + 1;
    while (nextIdx < contacts.length && !activeFilters.includes(contacts[nextIdx]._status)) {
        nextIdx++;
    }

    if (nextIdx < contacts.length) {
        selectContact(nextIdx);
    } else {
        renderQueue();
    }
  }
</script>

</body>
</html>
